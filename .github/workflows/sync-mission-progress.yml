name: Sync Mission Book progress

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "mission-book/**/*.md"
      - "mission-book/PROGRESS_MANIFEST.json"
      - "mission-book/MISSION_PROGRESS.json"
      - "mission-book/tools/sync_mission_progress.py"
      - "mission-book/tools/sync_dependency_state.py"
      - "mission-book/tools/check_record_consistency.py"
      - "mission-book/tools/test_check_record_consistency.py"
  push:
    branches: [main]
    paths:
      - "mission-book/**/*.md"
      - "mission-book/PROGRESS_MANIFEST.json"
      - "mission-book/tools/sync_mission_progress.py"
      - "mission-book/tools/sync_dependency_state.py"
      - "mission-book/tools/check_record_consistency.py"
      - "mission-book/tools/test_check_record_consistency.py"

permissions:
  contents: write

concurrency:
  group: sync-mission-book-progress-${{ github.ref }}
  cancel-in-progress: true

jobs:
  progress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # THE RECORD GATES RUN FIRST, BEFORE ANYTHING IS REGENERATED OR COMMITTED. A record that contradicts itself must
      # not be "fixed" by regeneration: the point of the checker is that a human reads the finding. Both steps are pure
      # readers, so a failure here leaves the repository exactly as it was pushed.
      - name: Record-consistency checker tests
        run: python mission-book/tools/test_check_record_consistency.py

      - name: Mission Book records must be self-consistent
        run: python mission-book/tools/check_record_consistency.py

      - name: Check dependency propagation on PR
        if: github.event_name == 'pull_request'
        run: python mission-book/tools/sync_dependency_state.py --check

      - name: Reconcile dependency propagation on main
        if: github.event_name != 'pull_request'
        run: python mission-book/tools/sync_dependency_state.py

      - name: Regenerate Mission Book progress
        run: python mission-book/tools/sync_mission_progress.py

      - name: PR must carry synchronized generated view
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          if ! git diff --quiet -- mission-book/README.md mission-book/MISSION_PROGRESS.json; then
            echo "Mission Book homepage progress is stale."
            echo "Run: python mission-book/tools/sync_mission_progress.py"
            git diff -- mission-book/README.md mission-book/MISSION_PROGRESS.json
            exit 1
          fi

      - name: Commit synchronized progress on main
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          if git diff --quiet -- mission-book; then
            echo "Mission Book dependency state and progress already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mission-book
          git commit -m "sync(mission-book): refresh generated progress"
          git pull --rebase origin main
          git push origin HEAD:main
