name: Temporary PCF documentation maintenance

on:
  push:
    branches: ["docs/pcf-expansion-20261007"]
    paths: [".pcf-maintenance/**", ".github/workflows/pcf-plan-maintenance.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pcf-planning-maintenance
  cancel-in-progress: false

jobs:
  documentation:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Test scoped editing safety
        run: python -m unittest discover -s .pcf-maintenance -p 'test_*.py'
      - name: Apply parked planning changes and regenerate documentation
        run: python .pcf-maintenance/update.py --apply
      - name: Validate all documentation and workbook guards
        run: |
          python .pcf-maintenance/update.py --verify
          python mission-book/tools/test_check_record_consistency.py
          python mission-book/tools/test_documentation_preservation.py
          python mission-book/tools/test_mission_layout.py
          python mission-book/tools/check_record_consistency.py
          python mission-book/tools/sync_dependency_state.py --check
          python mission-book/tools/sync_mission_progress.py --check
          python mission-book/tools/sync_documentation_navigation.py --check
      - name: Remove temporary bootstrap and publish documentation candidate only
        shell: bash
        run: |
          rm .github/workflows/pcf-plan-maintenance.yml
          rm -r .pcf-maintenance
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs(pcf): strengthen cross-host execution and migrate prerequisite subscopes'
          git push origin HEAD:docs/pcf-expansion-20261007
          echo "CANDIDATE_SHA=$(git rev-parse HEAD)"
          echo "CANDIDATE_TREE=$(git rev-parse HEAD^{tree})"
