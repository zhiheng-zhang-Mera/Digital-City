# 中文完整对照 / Full Chinese explanation: RESEARCH_SIGNAL_WATCHLIST.zh-CN.md
schema_version: 1
snapshot_date: 2026-10-05
status: ACTIVE
purpose: >
  Pre-classified research-signal watchlist for normal Mission Book work.
  Agents should tag observed episodes against this list instead of inventing novelty claims.
grading:
  G1_MATURE:
    capture_level: MINIMAL
    interpretation: mature engineering / background only
  G2_CROWDED:
    capture_level: STANDARD
    interpretation: active and important, but crowded
  G3_SPARSE_ACTIVE:
    capture_level: PRIORITY
    interpretation: clear phenomenon with sparse direct study
  G4_RARE_SYSTEMIC:
    capture_level: MAXIMUM_BOUNDED
    interpretation: rare complete formulation/system evidence; recheck literature before claims

topics:
  - id: RS-G1-IMMUTABLE-VERSION
    grade: G1_MATURE
    topic: branch_to_exact_sha
    capture_when: concrete failure or rework only

  - id: RS-G1-VERTICAL-SLICE
    grade: G1_MATURE
    topic: classic_vertical_slice
    capture_when: concrete agent failure only

  - id: RS-G1-TRACEABILITY
    grade: G1_MATURE
    topic: generic_requirements_code_traceability
    capture_when: concrete failure only

  - id: RS-G2-COMPACTION
    grade: G2_CROWDED
    topic: context_compaction_timing_and_content
    capture_when: normal telemetry; priority only when intersecting G3/G4

  - id: RS-G2-EXEC-MEMORY
    grade: G2_CROWDED
    topic: generic_execution_state_memory
    capture_when: normal telemetry

  - id: RS-G2-FALSE-SUCCESS
    grade: G2_CROWDED
    topic: generic_false_completion_and_evidence_contracts
    capture_when: normal telemetry

  - id: RS-G2-ASYNC-MULTIAGENT
    grade: G2_CROWDED
    topic: generic_async_multi_agent_coordination
    capture_when: normal telemetry

  - id: RS-G2-CROSS-MODEL-REVIEW
    grade: G2_CROWDED
    topic: generic_cross_model_review
    capture_when: normal telemetry

  - id: RS-G2-EVOLVING-SPEC
    grade: G2_CROWDED
    topic: evolving_user_requirements
    capture_when: normal telemetry


  - id: RS-G2-REPO-RULES
    grade: G2_CROWDED
    topic: generic_repository_instruction_files_and_rule_learning
    capture_when: normal telemetry; do not treat AGENTS.md/rule learning itself as novelty

  - id: RS-G2-LONGITUDINAL-MAINTENANCE
    grade: G2_CROWDED
    topic: generic_long_horizon_maintenance_and_technical_debt
    capture_when: normal telemetry; SWE-CI/SlopCodeBench/ChainSWE/EvoClaw already cover the broad phenomenon

  - id: RS-G2-MERGE-CONFLICT
    grade: G2_CROWDED
    topic: generic_agent_merge_conflict_and_concurrent_editing
    capture_when: normal telemetry; prioritize only semantic integration beyond textual conflict

  - id: RS-G2-ACTION-BIAS
    grade: G2_CROWDED
    topic: generic_agent_abstention_action_bias_and_scope_expansion
    capture_when: normal telemetry; FixedBench/OverEager-style phenomena are already directly studied

  - id: RS-G2-OBSERVABILITY-DEBT
    grade: G2_CROWDED
    topic: generic_agent_generated_logging_observability_debt
    capture_when: normal telemetry; prioritize only if it affects control-plane observability or longitudinal evidence quality

  - id: RS-G3-EXEC-WORK-ARTIFACT
    grade: G3_SPARSE_ACTIVE
    topic: repository_resident_executable_work_state
    capture_when: claim/resume/review/evidence-bound task state is involved

  - id: RS-G3-IDENTITY-PROVENANCE
    grade: G3_SPARSE_ACTIVE
    topic: execution_identity_provenance_freshness
    capture_when: SHA/ancestry/evidence binding/reconciliation changes outcome

  - id: RS-G3-STRUCTURED-HANDOFF
    grade: G3_SPARSE_ACTIVE
    topic: structured_handoff_with_exact_state
    capture_when: successor agent/model/host resumes interrupted work

  - id: RS-G3-DYNAMIC-LIVENESS
    grade: G3_SPARSE_ACTIVE
    topic: dynamic_async_liveness_and_eligibility
    capture_when: zero-claim/wait/wake/role-eligibility/no-idle logic matters

  - id: RS-G3-INDEPENDENT-REVIEW-BOUNDARY
    grade: G3_SPARSE_ACTIVE
    topic: independent_review_as_state_and_evidence_boundary
    capture_when: reviewer independently reconstructs state or falsifies user/runtime path

  - id: RS-G3-REGISTRY-ONBOARDING
    grade: G3_SPARSE_ACTIVE
    topic: capability_registry_assisted_agent_onboarding
    capture_when: registry changes search/localization/duplicate implementation behavior

  - id: RS-G3-OWNER-INTERVENTION-TAXONOMY
    grade: G3_SPARSE_ACTIVE
    topic: naturalistic_owner_intervention_causes
    capture_when: Owner must resume/correct/unblock/reframe work


  - id: RS-G3-RULE-LIFECYCLE-DEBT
    grade: G3_SPARSE_ACTIVE
    topic: repository_rule_lifecycle_provenance_supersession_and_retirement
    capture_when: a rule is added from failure evidence, conflicts with another rule, becomes stale, is superseded, or causes measurable overhead/false blocking

  - id: RS-G3-SUPERVISION-ATTENTION
    grade: G3_SPARSE_ACTIVE
    topic: owner_attention_fragmentation_escalation_quality_and_batching
    capture_when: Owner interventions can be grouped by cause, decision value, avoidability, batching, or interruption cost

  - id: RS-G3-SEMANTIC-INTEGRATION
    grade: G3_SPARSE_ACTIVE
    topic: semantic_integration_conflict_beyond_textual_merge
    capture_when: independently green/accepted branches or capabilities integrate cleanly textually but conflict in product semantics, dependencies, ownership, or runtime behavior

  - id: RS-G4-UNIFIED-CONTROL-PLANE
    grade: G4_RARE_SYSTEMIC
    topic: unified_repository_control_plane
    capture_when: multiple MissionBook/Registry/identity/evidence/liveness mechanisms interact

  - id: RS-G4-CAPABILITY-STATE
    grade: G4_RARE_SYSTEMIC
    topic: implementation_wiring_reachability_intent_state
    capture_when: capability transitions among implementation/wiring/reachability/intent states

  - id: RS-G4-AUTONOMY-SURVIVAL
    grade: G4_RARE_SYSTEMIC
    topic: autonomy_survival_until_owner_intervention
    capture_when: long autonomous run or task-pool drain is observable

  - id: RS-G4-REALITY-DRIFT
    grade: G4_RARE_SYSTEMIC
    topic: control_plane_reality_drift
    capture_when: MissionBook/Registry/Git/CI/UI truths disagree

  - id: RS-G3-USER-REACHABLE-TERMINAL
    grade: G3_SPARSE_ACTIVE
    topic: user_reachable_completion_as_terminal_condition
    capture_when: internal/test completion differs from normal-user completion; adjacent false-success and user-like validation work already exists

  - id: RS-G3-PASSIVE-EVIDENCE-PIPELINE
    grade: G3_SPARSE_ACTIVE
    topic: passive_development_to_research_evidence_pipeline
    capture_when: normal development evidence becomes reusable longitudinal/replay material; real-session trace collection already exists, so prioritize City-specific control-plane evidence

  - id: RS-G2-GENERIC-AGENT-MONITOR
    grade: G2_CROWDED
    topic: generic_agent_monitoring_dashboard_topology_and_logs
    capture_when: normal telemetry only; dashboard/graph/log visualization alone is not a novelty claim

  - id: RS-G3-HIERARCHICAL-RISK-BUBBLING
    grade: G3_SPARSE_ACTIVE
    topic: hierarchical_operational_observability_with_risk_bubbling
    capture_when: overview/progressive-disclosure summaries must preserve active risk while hiding low-value detail

  - id: RS-G3-EDGE-CAUSAL-OBSERVABILITY
    grade: G3_SPARSE_ACTIVE
    topic: edge_centric_causal_observability_for_handoff_retry_review_and_routing
    capture_when: understanding why work moved or changed requires path/edge provenance rather than node state alone

  - id: RS-G3-OBSERVE-DECIDE-DECOUPLING
    grade: G3_SPARSE_ACTIVE
    topic: continuous_observation_with_event_triggered_nonblocking_decision
    capture_when: JEV/observer, decision queues, timeout/fallback, or synchronization behavior affects task progress

  - id: RS-G3-DECISION-ESCALATION-PROVENANCE
    grade: G3_SPARSE_ACTIVE
    topic: rule_fast_model_critic_owner_escalation_provenance
    capture_when: a state transition is resolved automatically or escalated and the decision source/latency/owner interruption can be observed

rules:
  - G1/G2 must not trigger research-only make-work.
  - G3/G4 episodes should preserve before/after and exact evidence when bounded and observable.
  - No grade is a novelty guarantee; literature must be refreshed before publication.
  - Hidden chain-of-thought must never be collected.
  - If a signal is not on this watchlist, record it as UNCLASSIFIED_CANDIDATE rather than inventing a grade.
