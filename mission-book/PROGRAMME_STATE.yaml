schema_version: 1
updated_date: 2026-09-30
control_repo: zhiheng-zhang-Mera/Digital-City
implementation_repo: zhiheng-zhang-Mera/Utopia
unified_component_baseline_sha: 82ed36933fb4c5b00e44768d9e1aedec1d525d9c

authority:
  static_programme_config: mission-book/PROGRAMME_STATE.yaml
  dynamic_task_claim_and_completion: each task workbook frontmatter
  evidence: mission-book/reports/<TASK-ID>/
  dashboards_are_authoritative: false

hosts:
  Alien: AVAILABLE
  Mech: AVAILABLE

programmes:
  butler_assistant:
    tasks: BA-001..BA-009
    status: READY
    component_pool_started: false
    merge_gate: AFTER_PROGRAMME_POOL_DRAIN
  remote_fabric:
    tasks: RF-001..RF-010
    status: READY
    component_pool_started: false
    merge_gate: AFTER_PROGRAMME_POOL_DRAIN
  general_ai_gateway:
    tasks: GAI-001..GAI-009
    status: READY
    component_pool_started: false
    merge_gate: AFTER_PROGRAMME_POOL_DRAIN
  engineering_manager:
    tasks: EM-001..EM-013
    status: READY
    component_pool_started: false
    merge_gate: AFTER_PROGRAMME_POOL_DRAIN

global_dispatch:
  enabled: true
  cross_programme_claims: true
  correction_requires_other_physical_host: true
  ordinary_claim_updates_dashboard_files: false
  claim_priority:
    - ACTIONABLE_OWNED_REPAIR
    - ELIGIBLE_CORRECTION_BY_OTHER_HOST
    - UNCLAIMED_DEVELOPMENT_ANY_PROGRAMME
  waiting_ci_releases_host_for_other_work: true
  waiting_external_releases_host_for_other_work: true
  separate_worktrees_required_for_parallel_local_claims: true
  zero_claim_single_scan_is_terminal: false
  temporary_unclaimable_rescan_enabled: true
  temporary_unclaimable_default_rescan_minutes: 20
  structural_ineligibility_allows_immediate_park: true
  global_external_block_allows_immediate_park: true
  component_stop_condition: GLOBAL_COMPONENT_POOL_DRAINED
  final_stop_condition: ALL_PROGRAMMES_TERMINAL_OR_TYPED_EXTERNAL_OWNER_ACTION_ONLY

external_acceptance:
  component_tasks_may_defer_real_external_proof_to_programme_integration: true
  false_success_forbidden: true
