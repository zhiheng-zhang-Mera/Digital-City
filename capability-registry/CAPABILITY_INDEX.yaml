    - mission-book/capability-entry-closeout/CAPABILITY_ENTRY_MATRIX.md
  final_bootstrap_gate:
    - mission-book/capability-entry-closeout/CEX-790-final-exposure-audit-and-freeze.md
  policy: >-
    Existing capabilities may remain LEGACY_BACKFILL_PENDING until verified.
    Any workbook that touches one must backfill/reconcile that capability record.
  final_audit_note: >-
    CEX-790 rebuilt the entry inventory from the code at the dependency union baseline and reconciled it against these
    records. The audit found one reality mismatch (CAP-WORKER-POOL-AGENT-001 still claiming a pending Formal Review
    after WBC-603 passed) and one unnamed user-facing surface (the capability bridge), both resolved here.

id_policy:
  prefix: CAP
  format: CAP-<DOMAIN>-<NNN>
  immutable_after_assignment: true

required_status_dimensions:
  implementation_status:
    - NOT_IMPLEMENTED
    - PARTIAL
    - COMPLETE
    - DEPRECATED
  backend_wiring_status:
    - NOT_APPLICABLE
    - NOT_READY
    - PARTIAL
    - VERIFIED
  user_reachability_status:
    - NOT_APPLICABLE
    - MISSING
    - PARTIAL
    - VERIFIED
  intent_validation_status:
    - NOT_APPLICABLE
    - NOT_TESTED
    - MISMATCH
    - VERIFIED

exposure_classes:
  - DIRECT_CONTROL
  - OBSERVABLE_ADVANCED
  - BACKGROUND_DISCLOSED
  - INTERNAL_ONLY

