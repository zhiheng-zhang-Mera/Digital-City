schema_version: 1
registry_status: BOOTSTRAP_ACTIVE
canonical_scope: digital-city-capability-inventory
last_reconciled_at: null
last_reconciled_city_sha: null

authority:
  mission_execution_truth: mission-book
  capability_inventory_truth: capability-registry
  implementation_truth: implementation repositories at exact full SHA
  runtime_truth: observed runtime / UI / E2E evidence

bootstrap:
  legacy_backfill_status: PENDING
  seed_sources:
    - mission-book/capability-entry-closeout/CAPABILITY_ENTRY_MATRIX.md
  final_bootstrap_gate:
    - mission-book/capability-entry-closeout/CEX-790-final-exposure-audit-and-freeze.md
  policy: >-
    Existing capabilities may remain LEGACY_BACKFILL_PENDING until verified.
    Any workbook that touches one must backfill/reconcile that capability record.

id_policy:
  prefix: CAP
  format: CAP-<DOMAIN>-<NNN>
  immutable_after_assignment: true

required_status_dimensions:
  implementation_status:
    - NOT_IMPLEMENTED
    - PARTIAL
    - COMPLETE
    - DEPRECATED
  backend_wiring_status:
    - NOT_APPLICABLE
    - NOT_READY
    - PARTIAL
    - VERIFIED
  user_reachability_status:
    - NOT_APPLICABLE
    - MISSING
    - PARTIAL
    - VERIFIED
  intent_validation_status:
    - NOT_APPLICABLE
    - NOT_TESTED
    - MISMATCH
    - VERIFIED

exposure_classes:
  - DIRECT_CONTROL
  - OBSERVABLE_ADVANCED
  - BACKGROUND_DISCLOSED
  - INTERNAL_ONLY

records:
  - capability_id: CAP-IDENTITY-001
    record_ref: records/CAP-IDENTITY-001.yaml

  - capability_id: CAP-ASK-001
    record_ref: records/CAP-ASK-001.yaml

  - capability_id: CAP-EXECUTION-001
    record_ref: records/CAP-EXECUTION-001.yaml

  - capability_id: CAP-RESEARCH-TRACE-001
    record_ref: records/CAP-RESEARCH-TRACE-001.yaml

  - capability_id: CAP-NODE-DESCRIPTOR-001
    record_ref: records/CAP-NODE-DESCRIPTOR-001.yaml

  - capability_id: CAP-SCHEDULER-CHOICE-001
    record_ref: records/CAP-SCHEDULER-CHOICE-001.yaml

  - capability_id: CAP-ONBOARDING-OWNER-001
    record_ref: records/CAP-ONBOARDING-OWNER-001.yaml

  - capability_id: CAP-CITY-MEMBERS-NATIVE-001
    record_ref: records/CAP-CITY-MEMBERS-NATIVE-001.yaml

  - capability_id: CAP-WORKER-POOL-AGENT-001
    record_ref: records/CAP-WORKER-POOL-AGENT-001.yaml

  - capability_id: CAP-MON-001
    record_ref: records/CAP-MON-001.yaml

  - capability_id: CAP-EXPERIMENT-MANIFEST-001
    record_ref: records/CAP-EXPERIMENT-MANIFEST-001.yaml
