  "known_gaps": [
    "Intent validation NOT_TESTED: the deterministic router deliberately does NOT offer AGENT_JOB as an ask target. A job cannot be well formed from a sentence (it needs a title, an instruction and a stated purpose), and the router's job is to offer only requests it can complete, so a natural-language path is not claimed.",
    "The channel is OFF unless the owner sets CITY_AGENT_JOB=1. With the switch off, every dispatch is refused by name (AGENT_JOB_DISABLED); there is no allowlist to configure because the channel names no program and opens no directory - the contract bounds it instead (bounded text inputs, a bounded deadline, credential-shaped inputs refused by name).",
    "NO OPPOSITE-HOST RUN YET: the CITY half and the far-side CLI are proved against a real gateway, a real node credential and a real browser, and have been RUN AGAINST THE LIVE CITY by the development host (register -> owner dispatch -> claim -> report -> owner read-back, at 66bab47e). Handing a job to the AGENT on the opposite physical machine is still NOT RUN: the far side must first run `scripts/agent-job.mjs register`, a bootstrap no City-side change can perform for it. A job for it is already queued untargeted on the live City (Q-b4b7d3c1-12d9-49c6-828e-ff7d832eeaa6, digest dcd8172b05e53f62e72bcc0912d961528a7f3bb4045685a1452c29a204168fe4).",
    "A job cannot be TARGETED at a machine identity the City has never seen: creation-time targeting refuses TARGET_DEVICE_UNKNOWN (measured). The far side must register before the owner can name it; until then the request must be left untargeted, which means any node advertising the capability may take it.",
    "An agent's summary is unverifiable by construction: the City checks the SHAPE and the honesty of the claim, never its truth. This is stated on every accepted report and is the reason the capability is a REQUEST/REPORT channel rather than an execution channel - use CAP-CITY-REMOTE-OPERATION-001 when the work must be a program whose bytes the City can check.",
    "Expiry is a PROJECTION, not a scheduler: a job past its deadline is not handed out and is SHOWN as expired while the canonical task keeps the state it actually reached, because the City does not invent a transition it never performed.",
    "A far-side node must HEARTBEAT to keep being offered work, because the City marks a node offline one heartbeat timeout after its last one and never hands an offline node anything - and a channel that has gone quiet looks exactly like a City with nothing to do. The CLI sends a heartbeat as part of `claim` and exposes `heartbeat` for a machine that is busy answering; a deployment integrating the CLI some other way must do the same.",
    "Android has no surface for this capability: reachability is WEB + CLI only.",
    "Five defects were found only by running this on the real City and in real load, not by the tests as first written: the report gate compared the task's state against the JOB's vocabulary (so a SUCCEEDED report skipped validation entirely), the credential pattern could never match a real `ghp_` token, the CLI never heartbeat, the fixed sidebar had no scrolling region (one more entry made a nav item unclickable), and two page titles rendered their raw i18n key. All five are fixed and each now has a test that fails without the fix.",
    "No independent review of this capability has been performed."
  ],
