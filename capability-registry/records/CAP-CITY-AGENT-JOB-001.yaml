  "known_gaps": [
    "Intent validation NOT_TESTED: the deterministic router deliberately does NOT offer AGENT_JOB as an ask target. A job cannot be well formed from a sentence (it needs a title, an instruction and a stated purpose), and the router's job is to offer only requests it can complete, so a natural-language path is not claimed.",
    "The channel is OFF unless the owner sets CITY_AGENT_JOB=1. With the switch off, every dispatch is refused by name (AGENT_JOB_DISABLED); there is no allowlist to configure because the channel names no program and opens no directory - the contract bounds it instead (bounded text inputs, a bounded deadline, credential-shaped inputs refused by name).",
    "NO OPPOSITE-HOST RUN YET: the CITY half and the far-side CLI are proved against a real gateway, a real node credential and a real browser, and have been RUN AGAINST THE LIVE CITY by the development host (register -> owner dispatch -> claim -> report -> owner read-back, at 66bab47e). Handing a job to the AGENT on the opposite physical machine is still NOT RUN: the far side must first run `scripts/agent-job.mjs register`, a bootstrap no City-side change can perform for it. As of 2026-10-08 14:07 (read back from the live City) the job waiting for it is Q-a0aa3ec5-c101-497c-a3f7-70d96698388f, state QUEUED, created 2026-10-08T01:54:44Z, digest 4a070ae8a555e0644b62bc56c5dd1bc8d6f120e19e51ceebf5e7ce328df97945, untargeted (assignedNodeId null), inputs scripts/rex890-opposite-host-reproduce.mjs and evidence/raw/rex890-studies/2026-10-08-B/artifact. THIS ENTRY PREVIOUSLY NAMED Q-b4b7d3c1-12d9-49c6-828e-ff7d832eeaa6 AS 'ALREADY QUEUED', AND THAT BECAME FALSE: that job was CANCELLED on 2026-10-08T01:51:19Z and replaced, because its inputs pointed at the older package path (4in1-acceptance-2026-10-07/rex890-dev-study/artifact) rather than at the package that carries its own trace evidence. Recorded here rather than silently overwritten, since a reviewer following the old id would have found a cancelled job and could not tell why.",
    "THE WAITING JOB IS NOW STRICT-TARGETED AT THE OPPOSITE HOST, WHICH CLOSES A REAL HAZARD IN THE CRITICAL PATH. As of 2026-10-08 14:5x the job waiting for them is Q-85be5da7-d1a5-43d6-83c2-f32b1ca4759c, state QUEUED, targetDeviceRef dev-1428bce5297146df88720f270af71bc3 (the City MEMBER whose displayName is \"Alien\"), targetStateAtCreation OFFLINE - so the task WAITS for that machine and NO OTHER NODE CAN BE GIVEN IT. WHY THAT MATTERS: the previous job (Q-a0aa3ec5) was UNTARGETED because their device had never registered when it was created, and an untargeted AGENT_JOB may be claimed by ANY node advertising city.agent-job.v1 - this host has a second registered compute node (dev-mega-agentjob, offline) that could have taken their request, and `/api/v0/node/claim` takes only a node id and NOT a task id, so a routine claim with a node credential could have consumed it. That is also why this host did not run a claim-based lifecycle probe against the live City: the same measurement that shows the channel working would have consumed their handoff request, and a probe is not worth the critical path. The instruction, purpose, inputs and deadline were copied VERBATIM out of the stored record (verified byte-identical after re-submission) rather than retyped, and the untargeted job was CANCELLED rather than deleted so the history stays readable.",
    "A job cannot be TARGETED at a machine identity the City has never seen: creation-time targeting refuses TARGET_DEVICE_UNKNOWN (measured). The far side must register before the owner can name it; until then the request must be left untargeted, which means any node advertising the capability may take it.",
    "An agent's summary is unverifiable by construction: the City checks the SHAPE and the honesty of the claim, never its truth. This is stated on every accepted report and is the reason the capability is a REQUEST/REPORT channel rather than an execution channel - use CAP-CITY-REMOTE-OPERATION-001 when the work must be a program whose bytes the City can check.",
    "A DEFECT IN THIS CLAIM WAS FOUND BY PROBING THE LIVE CITY, and it is repaired. The record said credential-shaped inputs are refused by name, which was true - but only `inputs[].name` and `inputs[].text` were scanned. MEASURED 2026-10-08 against the live City: the same credential shape in the job's `instruction` or in its `purpose` was ACCEPTED, the job went QUEUED, and the stored record contained it (read back and confirmed; both probe jobs were cancelled afterwards, and the shape used was a FAKE one - twenty A's - because a real token must never be used to demonstrate this). Title, instruction, purpose and expect are all persisted and all shown on the owner's surface, so the scan had protected the field nobody types a token into and missed the two somebody actually would. Repaired at utopia f0295bc9f43f98216c9b69697da8f0151037908a: all four stored statement fields go through the same rule under a distinct code JOB_CREDENTIAL_REFUSED that names the field, with regression tests per field, the real token shapes the inputs cases already used, and the other direction pinned as well (an instruction that merely names the WORD token is still accepted, because the rule is about values and not vocabulary). THE LIVE RE-PROOF HAS NOW HAPPENED: the City was restarted onto the repaired code and the same probe passes 9/9 against it - every stored field refuses by name (JOB_INPUT_CREDENTIAL_REFUSED for inputs[].name and inputs[].text, JOB_CREDENTIAL_REFUSED naming title, instruction, purpose or expect), every refusal creates NO task, no record created afterwards carries the shape, and a job that merely names a token file is still accepted so the rule stays about values and not vocabulary. The probe is filed with its result at utopia evidence/raw/capability-city-agent-job/. IT ALSO REPORTS WHAT THE FIX CANNOT UNDO: two records created BEFORE the repair (Q-1e96a663-7a20-46d7-af08-cc5e971106e4 and Q-54293399-bfbc-4015-98c0-75a30aee834a, both CANCELLED) still carry the shape, because cancelling a job does not erase its record and a fix prevents new records rather than rewriting old ones; the shape is fake (twenty A's), which is why they are LISTED rather than deleted - erasing them would erase the evidence that the defect happened.",
    "Expiry is a PROJECTION, not a scheduler: a job past its deadline is not handed out and is SHOWN as expired while the canonical task keeps the state it actually reached, because the City does not invent a transition it never performed.",
    "A SECOND DEFECT IN THE SAME AREA, FOUND BY READING THE LIVE RESERVATION RATHER THAN THE CODE, and also repaired: this capability's switch and the remote-operation one are read from the ENVIRONMENT at startup, are in no config file, and the City's reservation `startup` record - the only thing scripts/restart-gateway.ps1 replays - did not carry them. MEASURED 2026-10-08: the reservation held the five service keys and none of the capability switches, while the live City reported both channels enabled. So restarting the canonical way would have brought the City up with BOTH cross-machine channels silently DISABLED, and this channel's jobs would have been refused as if the owner had never turned it on - an owner decision that cannot survive a restart is a state of the process, not a capability of the system. Repaired at utopia 05ae385: the startup record carries the switches and the restart script replays them, asserted as a whole round trip (recorded, replayed through the real restart-gateway.ps1, recorded again) in tests/host-city-launcher.test.mjs. Verified live in the same action - the restart published the switches and the City came back with both channels enabled, the same allowlist and workspaces, the same cityId and the same QUEUED job.",
    "A far-side node must HEARTBEAT to keep being offered work, because the City marks a node offline one heartbeat timeout after its last one and never hands an offline node anything - and a channel that has gone quiet looks exactly like a City with nothing to do. The CLI sends a heartbeat as part of `claim` and exposes `heartbeat` for a machine that is busy answering; a deployment integrating the CLI some other way must do the same.",
    "Android has no surface for this capability: reachability is WEB + CLI only.",
    "Five defects were found only by running this on the real City and in real load, not by the tests as first written: the report gate compared the task's state against the JOB's vocabulary (so a SUCCEEDED report skipped validation entirely), the credential pattern could never match a real `ghp_` token, the CLI never heartbeat, the fixed sidebar had no scrolling region (one more entry made a nav item unclickable), and two page titles rendered their raw i18n key. All five are fixed and each now has a test that fails without the fix.",
    "A SIXTH defect was found by chasing a browser test that failed only under load, and it is repaired: `app.js` re-renders the current page from `refresh()`, which runs every four seconds AND on every event the City pushes over the WebSocket, so a rebuild discarded the open `<details>` and the focused field. On THIS surface that means an owner opens the Danger Zone, types the exact job title the confirmation demands, and the region closes underneath them - the control present, correct and unusable. Carried across the rebuild now (apps/web/view-persistence.js), with tests/web-surface-rebuild-persistence.test.mjs causing a real City event and requiring the region to stay open with the typing, focus and caret intact. What looked like load-sensitive flakiness in earlier rounds was this defect.",
    "No independent review of this capability has been performed."
  ],
