      "WHY last_verified_full_sha MOVED from 00989b6e67bcc99ce6b45133529458bbe0575fe1 to 314326007dce6e328792053936ce4c3a80c3b1e2, MEASURED rather than assumed: `git diff --stat 00989b6e..3143260` over this record's declared paths reports services/dev-gateway/server.mjs and apps/web/agent-jobs.js changed and a NEW file apps/web/view-persistence.js; the contract (contracts/city-agent-job-v1/job.mjs and index.mjs), actions.mjs, main.mjs, node-task-capabilities.mjs, execution-backend/standard-devices.mjs and scripts/agent-job.mjs are unchanged. The changes are the repaired defects this record already documents in known_gaps (the surface rebuild that discarded an owner's typing, and the gateway change that accompanied it), which is why the new file is now declared as part of the implementation; the head carrying them is CI-green, so the old SHA described a state the branch has left.",
      "WHY last_verified_full_sha MOVED AGAIN, from 314326007dce6e328792053936ce4c3a80c3b1e2 to f0295bc9f43f98216c9b69697da8f0151037908a: this time the capability's OWN CODE changed. Live probing found that only inputs[].name and inputs[].text were scanned for credential shapes while title, instruction, purpose and expect are ALL persisted, so a token typed into an instruction was accepted and stored (see known_gaps). The repairing head is CI-green: utopia run 37723129507 (success, https://github.com/zhiheng-zhang-Mera/utopia/actions/runs/37723129507), with the contract suite 14/14 and the web, host-independence and rebuild-persistence suites unchanged. WHAT IS STILL NOT TRUE: the live City runs the pre-fix code, so a live refusal of a credential-shaped statement has not been observed yet - that re-proof waits on that City's next restart, and this record says so rather than implying the fix has been seen working in production. The remote-operation capability's code did NOT change here, so CAP-CITY-REMOTE-OPERATION-001 stays at 3143260.",
      "WHY last_verified_full_sha MOVED ONCE MORE TO da4874ecfa89fa5354bc376c33167896da5fe2bf, AND A CORRECTION TO THE SENTENCE ABOVE: this capability's switch (CITY_AGENT_JOB) lived only in the environment and was not in the City's reservation `startup` record, which is all restart-gateway.ps1 replays - so a canonical restart silently turned this channel OFF (see known_gaps). That is a change to services/dev-gateway/main.mjs, which THIS record declares as part of its implementation, so the verified head has to move for the same reason the remote-operation record's did. The clause above saying CAP-CITY-REMOTE-OPERATION-001 stays at 3143260 was true when written and is SUPERSEDED, not deleted: that record moved to da4874e too, because the same fix carries its switch. CI is green at da4874e (run 37724251628) - and in CI the launcher tests actually RUN (no resident City), so the round trip they assert was exercised there for real. The live City was restarted onto this code in the same action and its reservation now publishes all four switches.",
      "DEFAULT-OFF WAS READ FROM THE CITY ITSELF, NOT ONLY FROM THE CODE: `GET /api/v0/node/jobs` returns an exposure descriptor for this capability stating `defaultEnabled: false` while the same response's `config` states `enabled: true` - the City saying 'off unless the owner turns it on, and it is on because they did'. The descriptor carries `capabilityId: CAP-CITY-AGENT-JOB-001`, which is the id of THIS record, so the product and the registry agree on the capability's identity rather than merely sharing a name. WHAT IS STILL NOT MEASURED LIVE: the AGENT_JOB_DISABLED refusal that a switch-OFF City produces (that path is exercised by the suite only). THE REASON IS NOW MEASURED RATHER THAN ASSUMED: a second City cannot be started on this host, because the host reservation is machine-wide - `node services/dev-gateway/main.mjs` exits immediately with `Utopia Gateway already reserved on this host: http://172.31.12.151:4310` (measured 2026-10-08, resident City verified undisturbed afterwards), so observing a switch-OFF City here would mean stopping and restarting the RESIDENT one with the switches unset, which is the environment the opposite host's reproduction depends on.",
      "THE DELIVERY RECEIPT IS NOW MEASURED ON THE LIVE CITY, AND IT NEEDED NO CLAIM TO BE MEASURED. This record said the claim-report-collect-consume chain had not been re-measured after the City restart, and a claim cannot name a task - so claiming could consume the request queued for the opposite host. But the RECEIPT is the owner's idempotent act on a job that already carries a report, so it can be re-read safely, and it now is: utopia evidence/raw/capability-city-agent-job/consumption-probe.mjs passes 8/8 against a job the City already held. The receipt states on its face that it is an ACKNOWLEDGEMENT_NOT_VERIFICATION and an AGENT_OBSERVATION_NOT_CITY_VERIFICATION with agentConsumption false; it BINDS to the stored bytes, with reportDigest recomputed here from the City's own report using the contract's canonicalisation (c00c016b... on both sides); taking delivery again returns the recorded receipt with the SAME digest and timestamp; a different note is refused 409 CONSUMPTION_ALREADY_RECORDED; and the reader's act changed neither the job nor the stored report. STILL NOT RE-MEASURED: claim and report themselves, for the reason above - a deliberate omission rather than an oversight.",
