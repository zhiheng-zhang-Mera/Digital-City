  "known_gaps": [
    "Android has no surface for this capability: reachability is WEB only, so user_reachability_status is PARTIAL rather than VERIFIED.",
    "Intent validation NOT_TESTED: the deterministic router deliberately does NOT offer OWNER_REMOTE_OPERATION as an ask target, because the request cannot be well formed without a declared executable, argv, working directory and purpose. A natural-language path is therefore not claimed.",
    "The capability is OFF unless the owner sets CITY_REMOTE_OPERATION=1 together with an explicit executable allowlist and workspace roots; with the switch off, or with either list empty, every dispatch is refused by name.",
    "Arbitrary shell is NOT supported and is not planned as a fallback: the contract never uses a shell, so shell syntax in an argument is inert data rather than a feature.",
    "Not yet exercised on two real machines: the tests run a real gateway and a real node agent on one host. The cross-host use (the opposite physical host reproducing a study) is the next step and is NOT RUN.",
    "EXERCISED AGAINST A LIVE CITY ON 2026-10-08, BUT STILL ON ONE PHYSICAL HOST - the two things are different and are recorded separately. The tests run a real gateway and a real node agent on one host; a live probe now asks the same questions of the real City and passes 14/14, filed WITH its instrument at utopia evidence/raw/capability-city-remote-operation/ (live-probe.mjs, live-probe-result.json, head 0033c12). MEASURED there, not asserted: a declarative dispatch is accepted and the program really runs on the node the owner named (git --version, exit 0, stdout observed, assignedNodeId equal to the named node); the operation row records shell:false; the City re-checks the receipt and records acceptanceAuthority false; the no-shell guarantee is demonstrated by passing 'rev-parse;echo INERT' as ONE argv element, which makes git report that whole string as a single unknown subcommand with stdout empty, so nothing was interpreted as a second command; and seven refusals are each named (EXECUTABLE_NOT_ALLOWED, EXECUTABLE_REQUIRED, WORKING_DIRECTORY_OUTSIDE_WORKSPACE for both an absolute outside path and a .. climb, PURPOSE_REQUIRED, ARGV_INVALID for a non-string and for a NUL byte) with task=null in every case, so a refused operation creates nothing. THE CROSS-PHYSICAL-HOST CASE IS STILL NOT RUN: the probe targets the node on the same machine as the City, so 'an owner on one host operating a different host' remains unproven.",
    "No independent opposite-host review of this capability has been performed.",
    "OWNER-ONLY IS NOW MEASURED LIVE AT THE CREDENTIAL BOUNDARY - INCLUDING THIS CAPABILITY'S OWN READ SURFACE - and the trade described above turned out to be avoidable. The live City was asked to refuse credentials that are not the owner's, using credentials that already exist on this machine so the roster the opposite host compares against stays unchanged (utopia evidence/raw/city-auth-boundary/, probe and result filed, head 5d75943): on the operation log specifically, the owner token reads it (HTTP 200, 20 operations), a wrong token is refused 401 'Invalid pairing token', no credential at all is refused, and the NODE token - a real credential for this same City, just not the owner's - is refused 401. The same boundary was measured on the agent-job route as well (200 with 8 jobs; the node token refused), an unauthenticated dispatch is refused and creates nothing (jobs counted 8 -> 8), every refusal carries no data, and no response echoes a credential back. WHAT STILL RESTS ON THE SUITE: a MEMBER SESSION's refusal on this route is exercised in tests/city-remote-operation-gateway.test.mjs (CR-OP 4) rather than live, because a member session needs an enrolled member device and enrolling one would change the roster the opposite host's reproduction reads. A node credential being refused is not the same statement as a member session being refused, and both are stated separately rather than merged into one comfortable sentence.",
    "Two defects in THIS surface were found only when the agent-job channel added a navigation entry beside it, and both are repaired: the fixed sidebar had no scrolling region, so the last entries became unreachable at the default window height (a navigation entry nobody can click is a control that does not exist), and this page's title rendered the raw i18n key because app.js derives it from the lowercased page name. The browser test for the agent-job surface now walks every navigation entry and fails on either, so the guard covers this page too.",
    "A third, more serious surface defect was found by chasing a test that failed only under load, and it is repaired: `app.js` re-renders the current page from `refresh()`, which runs every four seconds AND on every event the City pushes over the WebSocket, so a rebuild threw away the open `<details>` and the focused field. An owner could open this Danger Zone, type the exact confirmation the gate demands, and have the region close underneath them - the control present and unusable. Fixed in both surfaces by carrying the open state and the focused field/caret across the rebuild (apps/web/view-persistence.js). The previous rounds' 'load-sensitive' browser flakes were this defect, not load: tests/web-surface-rebuild-persistence.test.mjs now causes a real City event and requires the region to stay open with the typing intact."
  ],
