      "utopia:push CI at the current line: run 37720240214 (success, head 314326007dce6e328792053936ce4c3a80c3b1e2, https://github.com/zhiheng-zhang-Mera/utopia/actions/runs/37720240214); earlier green runs on this branch: 37715239464 (803c18d1dcc184b0e44a5e1806ad2d25b8100dc6) and 37718959850 (de7e91b38484513a99391e5207d199ad48cba3e9).",
      "WHY last_verified_full_sha MOVED from 00989b6e67bcc99ce6b45133529458bbe0575fe1 to 314326007dce6e328792053936ce4c3a80c3b1e2, MEASURED rather than assumed: the capability's own paths are NOT byte-identical to the old line. `git diff --stat 00989b6e..3143260` over this record's declared paths reports services/dev-gateway/server.mjs changed and a NEW file apps/web/view-persistence.js; the contract (contracts/city-remote-operation-v1/operation.mjs), actions.mjs, main.mjs, agents/reference-node/runner.mjs and apps/web/remote-operation.js are unchanged. Both changes are the repaired defects this record already documents in known_gaps - the view-persistence repair (which is why the new file is now declared as part of the implementation) and the gateway change that accompanied it - and the head carrying them is CI-green, so the old SHA described a state the branch has left.",
      "WHY last_verified_full_sha MOVED AGAIN TO da4874ecfa89fa5354bc376c33167896da5fe2bf: this capability's switch (CITY_REMOTE_OPERATION with its allowlist and workspaces) lived ONLY in the environment, and the City's reservation `startup` record - the only thing restart-gateway.ps1 replays - did not carry it, so a canonical restart silently turned this capability OFF and the owner's decision did not survive it. MEASURED by reading the live reservation, repaired at 05ae385 (the startup record carries the switches, the restart script replays them, and the launcher test asserts the whole round trip), with CI green at da4874e (run 37724251628, https://github.com/zhiheng-zhang-Mera/utopia/actions/runs/37724251628) - which is also the head where the live probe was re-run against the restarted City: 14/14 again, on the code the City is now actually running.",
      "THE LIVE CITY WAS RESTARTED ONTO THIS CODE, and that is a measured fact rather than an intention: after the restart the reservation published all four capability switches, the City answered with the same cityId (544adda1-...), remoteOperation.enabled true with the same allowlist [node,git,corepack] and workspaces [C:/,D:/], its own host agent online, and the opposite host's handoff job still QUEUED - so the restart preserved the state the independent reproduction depends on and the owner's decisions with it.",
      "THE BOUNDS AND THE AUDIT ARE NOW MEASURED TOO, NOT ONLY ASSERTED. The filed live probe (utopia evidence/raw/capability-city-remote-operation/, head 3bc1bbf) passes 21/21 against the real City, seven of them new: a timeout and an output cap above the ceiling are REFUSED BY NAME (TIMEOUT_EXCEEDS_LIMIT for timeoutMs 99999999, OUTPUT_LIMIT_EXCEEDS_LIMIT for maxOutputBytes 99999999) and a non-positive bound is BOUNDS_INVALID, each leaving NO task; an environment override is refused even when the object is EMPTY, so 'no environment injection' cannot depend on what the payload contained; and the bounds really BIND - a program that outlived a 1500 ms timeout came back timedOut with durationMs 1555 and the process stopped, and a 400000-byte output came back truncated at exactly the declared 4096 bytes. The audit row is asserted to carry the purpose, the program, the argv and the workspace, which is what makes 'the audit is the product feature' checkable rather than aspirational.",
      "A COMMENT IN THIS CAPABILITY WAS WRONG AND IS CORRECTED: the module's header said the bounds were 'CLAMPED, NOT TRUSTED' while the code REFUSES values above the ceiling by name. That is not a wording quibble - a caller who believes a too-large number is quietly reduced designs against a guarantee that does not exist - so the comment now states what the code does and carries the measurement that shows it (3bc1bbf). `git diff da4874e..3bc1bbf` over the contract shows the change is COMMENT-ONLY, which is why last_verified_full_sha stays at the behaviour-bearing head da4874e rather than moving for a comment. The first run of the new probe section failed one check because the probe's own row projection omitted the audit fields and asked a healthy City for undefined values; the probe was fixed, and the failure is recorded here rather than quietly rerun away.",
      "DEFAULT-OFF WAS READ FROM THE CITY ITSELF, NOT ONLY FROM THE CODE: `GET /api/v0/node/operations` returns an exposure descriptor for this capability stating `defaultEnabled: false` while the same response's `config` states `enabled: true` with the allowlist and workspaces - the City saying 'off unless the owner turns it on, and it is on because they did'. The descriptor also carries `capabilityId: CAP-CITY-REMOTE-OPERATION-001`, which is the id of THIS record, so the product and the registry agree on the capability's identity rather than merely sharing a name. WHAT IS STILL NOT MEASURED LIVE: the refusals a switch-OFF City produces (they are exercised in the suite only). THE REASON IS NOW MEASURED RATHER THAN ASSUMED: a second City cannot be started on this host at all, because the host reservation is machine-wide - `node services/dev-gateway/main.mjs` exits immediately with `Utopia Gateway already reserved on this host: http://172.31.12.151:4310` (measured 2026-10-08, with the resident City verified undisturbed afterwards), so the only way to observe a switch-OFF City here would be to stop and restart the RESIDENT one with the switches unset - which is exactly the environment the opposite host's reproduction depends on.",
      "THE VERIFIED HEAD MOVED TO 60ddf4bd05148293572babf929f2f9d309ee729d, AND THIS TIME THE PRODUCT CODE DID NOT CHANGE: what changed is the EVIDENCE LAYER. The live probe is now portable (its workspace comes from a --cwd parameter instead of a path on one machine, and two refusal inputs no longer carry drive letters) and it now has a guard that fails if any probe bakes in a host address, a host state path, a device id or a quoted drive-letter path, or uses a credential-shaped literal that is not an obvious fake. That guard is listed in this record's references above, and a reference must resolve at the head the record anchors to - so the head moved with it rather than leaving a citation no reader could open. The behaviour is unchanged and was re-measured after the change: the probe still passes 21/21 against the live City with the same typed refusal codes, which is what makes a portability fix provably free of lost coverage.",
      "THE LIVE PROBE RAN AT 0033c1296ebd48febe80d96dc9f84569b5435b8d, AND WHY THE FIELD DID NOT MOVE TO IT AT THE TIME: `git diff --name-only 3143260..0033c12` shows the ONLY difference is the two evidence files (live-probe.mjs, live-probe-result.json) - the capability's code is byte-identical - so 3143260 remained the head whose code was verified, and that head's CI was green (run 37720240214). CI at 0033c12 failed twice, UNRELATED to this capability and DIFFERENTLY each time: attempt 1 on tests/mon901-observation.test.mjs with the known ENOTEMPTY temp-directory teardown race (that file passes 8/8 three times locally), attempt 2 on JOIN-501 (32.0s) and REX807 S11 (47.0s), both long browser tests. Different tests failing on each attempt, none of them touching this capability, is the signature of runner contention rather than of evidence-only files, so the red run is recorded here instead of being smoothed into a pass or hidden - and a green run would not by itself have proved the absence of a defect either. THE CLASSIFICATION WAS THEN TESTED RATHER THAN LEFT AS AN OPINION: attempt 3 of the SAME head 0033c12 completed SUCCESS (run 37721891288), with no change to the code between the failing and the passing attempts, which is what contention predicts and what a defect introduced by the evidence files would have contradicted."
