  "known_gaps": [
    "Only the Web surface exists. No Android surface is claimed; the programme assigns cross-device monitor acceptance to MON-990.",
    "The decision window is surfaced as its own Advanced page because the City monitor page that will host it belongs to MON-902, which is developed but not yet merged. The projection already carries the decisions, so folding the panel in is a presentation change.",
