schema_version: "0.3"

city:
  name: "Digital-City"
  repository: "https://github.com/zhiheng-zhang-Mera/Digital-City"
  phase: "DIGITAL_CITY_DIRECTORY_RESTRUCTURED"
  project_mapping_review: "PENDING"
  previous_registry_snapshot_commit: "818cc831a66d578c822e1f07b0a3b49b331fda11"
  monorepo: false
  model: "city -> city-infrastructure + districts -> buildings -> rooms; roads connect boundaries"
  policy_rule: "district/domain-scoped-by-default; city-wide only by explicit promotion"

roles:
  city_infrastructure: "Cross-city substrate and shared infrastructure that does not belong to one business domain"
  district: "First-level domain/civic area"
  building: "Coherent institution/product/service boundary inside a district"
  planned_building: "Explicit topology placeholder with PROJECT_NOT_CREATED and no implementation authority"
  room: "Capability owned by one building"
  road: "Stable cross-boundary interface, event, schema, dependency, or data flow"

infrastructure:
  path: "00-City-Infrastructure"
  mapping_state: "CONTENT_REVIEW_PENDING"
  slots:
    - id: "core-os"
      path: "00-City-Infrastructure/Core-OS"
    - id: "node-fabric"
      path: "00-City-Infrastructure/Node-Fabric"
    - id: "roads"
      path: "00-City-Infrastructure/Roads"
    - id: "control-centre"
      path: "00-City-Infrastructure/Control-Centre"

districts:
  - id: "government-safety"
    path: "01-Government-Safety"
    mapping_state: "CONTENT_REVIEW_PENDING"
  - id: "engineering"
    path: "02-Engineering"
    mapping_state: "CONTENT_REVIEW_PENDING"
  - id: "residential"
    path: "03-Residential"
    mapping_state: "CONTENT_REVIEW_PENDING"
  - id: "legal-privacy"
    path: "04-Legal-Privacy"
    mapping_state: "CONTENT_REVIEW_PENDING"
  - id: "health"
    path: "05-Health"
    mapping_state: "CONTENT_REVIEW_PENDING"
  - id: "research"
    path: "06-Research"
    mapping_state: "CONTENT_REVIEW_PENDING"
  - id: "finance"
    path: "07-Finance"
    mapping_state: "CONTENT_REVIEW_PENDING"
  - id: "device-edge"
    path: "08-Device-Edge"
    mapping_state: "CONTENT_REVIEW_PENDING"
  - id: "planning-knowledge"
    path: "09-Planning-Knowledge"
    mapping_state: "CONTENT_REVIEW_PENDING"
  - id: "automation"
    path: "10-Automation"
    mapping_state: "CONTENT_REVIEW_PENDING"
  - id: "entertainment"
