schema_version: "0.7"

city:
  name: "Digital-City"
  repository: "https://github.com/zhiheng-zhang-Mera/Digital-City"
  phase: "DIGITAL_CITY_BILINGUAL_DIRECTORY_SCHEMA"
  project_mapping_review: "PENDING"
  monorepo: false
  directory_naming: "number-metaphor_zh(en)-&-technical_zh(en)"
  model: "city -> city-infrastructure + districts -> buildings -> rooms; roads connect boundaries"

roles:
  city_infrastructure: "Cross-city substrate and shared infrastructure"
  district: "First-level domain/civic area"
  building: "Coherent institution/product/service boundary inside a district"
  room: "Capability owned by a building"
  capability_fabric: "Capability registration, provider mapping, discovery and invocation metadata; plugins are one packaging form"
  node_fabric: "Authorized device/node identity, membership, liveness, resource/capability host advertisement"
  road: "Stable cross-boundary semantic contract"

infrastructure:
  path: "00-城市地基(City-Foundation)-&-城市级共享基础设施(Citywide-Shared-Infrastructure)"
  mapping_state: "CONTENT_REVIEW_PENDING"
  slots:
    - id: "core-os"
      path: "00-城市地基(City-Foundation)-&-城市级共享基础设施(Citywide-Shared-Infrastructure)/01-城市核心(City-Core)-&-运行信任编排内核(Runtime-Trust-Orchestration-Kernel)"
    - id: "node-fabric"
      path: "00-城市地基(City-Foundation)-&-城市级共享基础设施(Citywide-Shared-Infrastructure)/02-城市节点网(City-Node-Network)-&-设备节点互联层(Device-Node-Fabric)"
    - id: "capability-fabric"
      path: "00-城市地基(City-Foundation)-&-城市级共享基础设施(Citywide-Shared-Infrastructure)/03-城市服务网(City-Service-Network)-&-能力注册发现层(Capability-Registry-Discovery-Layer)"
    - id: "city-roads"
      path: "00-城市地基(City-Foundation)-&-城市级共享基础设施(Citywide-Shared-Infrastructure)/04-城市道路(City-Roads)-&-跨域语义契约(Cross-Domain-Semantic-Contracts)"
    - id: "control-centre"
      path: "00-城市地基(City-Foundation)-&-城市级共享基础设施(Citywide-Shared-Infrastructure)/05-城市控制中心(City-Control-Centre)-&-人机控制界面(Human-Control-Surface)"
      building_state: "PARTIAL_FOUNDATION_EXISTS"
      existing_components:
        - repository: "https://github.com/zhiheng-zhang-Mera/General-Logic-Engine"
          role: "control-centre rule/state/explanation engine component"
          implementation_state: "DESIGN_BASELINE_NOT_YET_RUNTIME"
      missing_components:
        - "human-facing dashboard / city shell"
        - "navigation and visualization layer"
        - "command submission client"
        - "owner-attention and city activity surfaces"
      boundary: "General-Logic-Engine is a Control Centre backend component, not the city authority source, not the whole UI, and not a replacement for Core OS."

districts:
  - id: "government-safety"
    path: "01-市政治安区(Civic-Government-Safety-District)-&-治理安全域(Governance-Security-Domain)"
    mapping_state: "CONTENT_REVIEW_PENDING"
  - id: "engineering"
    path: "02-工务区(Engineering-Works-District)-&-工程运维域(Engineering-Operations-Domain)"
    mapping_state: "CONTENT_REVIEW_PENDING"
  - id: "residential"
    path: "03-居民区(Residential-District)-&-数字身份代理域(Digital-Identity-Agent-Domain)"
    mapping_state: "CONTENT_REVIEW_PENDING"
  - id: "legal-privacy"
    path: "04-法律隐私区(Legal-Privacy-District)-&-法律隐私治理域(Legal-Privacy-Governance-Domain)"
    mapping_state: "CONTENT_REVIEW_PENDING"
  - id: "health"
    path: "05-医疗健康区(Health-District)-&-健康数据服务域(Health-Data-Service-Domain)"
    mapping_state: "CONTENT_REVIEW_PENDING"
  - id: "research"
    path: "06-研究院区(Research-District)-&-研究实验域(Research-Experimentation-Domain)"
    mapping_state: "CONTENT_REVIEW_PENDING"
  - id: "finance"
    path: "07-金融区(Finance-District)-&-金融量化域(Financial-Quantitative-Domain)"
    mapping_state: "CONTENT_REVIEW_PENDING"
  - id: "device-edge"
    path: "08-设备边缘区(Device-Edge-District)-&-设备边缘计算域(Device-Edge-Computing-Domain)"
    mapping_state: "CONTENT_REVIEW_PENDING"
  - id: "planning-knowledge"
    path: "09-规划知识区(Planning-Knowledge-District)-&-规划知识管理域(Planning-Knowledge-Management-Domain)"
    mapping_state: "CONTENT_REVIEW_PENDING"
  - id: "automation"
    path: "10-自动化区(Automation-District)-&-自动化执行域(Automation-Execution-Domain)"
    mapping_state: "CONTENT_REVIEW_PENDING"
  - id: "entertainment"
    path: "11-娱乐区(Entertainment-District)-&-媒体沉浸交互域(Media-Immersive-Interaction-Domain)"
    mapping_state: "CONTENT_REVIEW_PENDING"

preserved_placeholders:
  - path: "01-市政治安区(Civic-Government-Safety-District)-&-治理安全域(Governance-Security-Domain)/01-海关安检(Customs-Security)-&-扩展准入检查(Extension-Admission-Checks)"
    status: "PROJECT_NOT_CREATED"
  - path: "01-市政治安区(Civic-Government-Safety-District)-&-治理安全域(Governance-Security-Domain)/02-公安监管(Public-Security)-&-运行时合规执行(Runtime-Compliance-Enforcement)"
    status: "PROJECT_NOT_CREATED"
  - path: "05-医疗健康区(Health-District)-&-健康数据服务域(Health-Data-Service-Domain)/01-综合医院(Integrated-Health-Hospital)-&-综合健康服务平台(Integrated-Health-Service-Platform)"
    status: "PROJECT_NOT_CREATED"
  - path: "06-研究院区(Research-District)-&-研究实验域(Research-Experimentation-Domain)/01-研究院(Research-Institute)-&-研究机制实验平台(Research-Mechanism-Experimentation-Platform)"
    status: "PROJECT_NOT_CREATED"
  - path: "11-娱乐区(Entertainment-District)-&-媒体沉浸交互域(Media-Immersive-Interaction-Domain)/01-娱乐中心(Entertainment-Centre)-&-媒体沉浸交互平台(Media-Immersive-Interaction-Platform)"
    status: "PROJECT_NOT_CREATED"

government_safety_registry:
  district_path: "01-市政治安区(Civic-Government-Safety-District)-&-治理安全域(Governance-Security-Domain)"
  existing_buildings:
    - id: "qualification-control"
      repository: "https://github.com/zhiheng-zhang-Mera/Boss-Qualification-Control"
      state: "EXISTING_INDEPENDENT_REPOSITORY"
      role: "qualification, real-soak isolation, attestation and promotion control plane"
      extraction_from_boss: false
  planned_extractions:
    - id: "customs-security"
      path: "01-市政治安区(Civic-Government-Safety-District)-&-治理安全域(Governance-Security-Domain)/01-海关安检(Customs-Security)-&-扩展准入检查(Extension-Admission-Checks)"
      current_implementation_source: "Codex-Boss"
      future_extraction:
        state: "PRESET"
        timing: "NOT_NOW"
        purpose: "ADMIT new buildings/extensions before activation"
        include:
          - "extension/plugin manifest and schema validation"
          - "extension identity/source verification hooks"
          - "declared dependency checks"
          - "requested capability/permission declaration checks"
          - "domain/storage namespace declaration checks"
          - "isolation/crash-boundary declaration checks"
          - "enable/disable/uninstall/rollback readiness checks"
          - "admission-time lifecycle preflight"
        exclude:
          - "Owner/Root Trust source of authority"
          - "runtime enforcement after admission"
          - "domain quality evaluation"
          - "Capability Fabric registry itself"
          - "domain business state"
        candidate_boss_surfaces:
          - "electron/security/permission-manifest.ts"
          - "electron/capability/plugin-contract.ts"
          - "generic admission portions of electron/capability/permission-contract.ts"
          - "config/city-replacement-lifecycle.json"
          - "generic extension lifecycle/preflight checks"
        extraction_gate:
          - "stable admission contract"
          - "independently testable"
          - "multiple independent extension/building consumers"
          - "no Boss-private-state dependency"
    - id: "runtime-compliance"
      path: "01-市政治安区(Civic-Government-Safety-District)-&-治理安全域(Governance-Security-Domain)/02-公安监管(Public-Security)-&-运行时合规执行(Runtime-Compliance-Enforcement)"
      current_implementation_source: "Codex-Boss"
      future_extraction:
        state: "PRESET"
        timing: "NOT_NOW"
        purpose: "ENFORCE city-wide hard boundaries at runtime"
        include:
          - "privilege-request enforcement"
          - "cross-domain access enforcement"
          - "protected-resource access checks"
          - "service/capability registration enforcement hooks"
          - "authority-escalation rejection"
          - "city-wide runtime-policy decision application"
          - "audit-friendly enforcement verdicts"
        exclude:
          - "Owner sovereignty"
          - "Root Trust / Root Authority source of truth"
          - "protected-surface constitutional definitions"
          - "domain-local policy"
          - "domain business state"
          - "qualification/promotion control"
        candidate_boss_surfaces:
          - "generic enforcement portions of electron/capability/authorization.ts"
          - "electron/commander/execution-gate.ts"
          - "electron/commander/runtime-policy.ts"
          - "cross-domain/runtime boundary enforcement hooks"
          - "city-wide permission decision application"
        extraction_gate:
          - "stable enforcement contract"
          - "authority facts supplied by Core rather than duplicated"
          - "independently testable"
          - "multiple city-domain enforcement points"
          - "clear independent lifecycle/failure-domain benefit"

engineering_registry:
  district_path: "02-工务区(Engineering-Works-District)-&-工程运维域(Engineering-Operations-Domain)"
  primary_orchestrator:
    repository: "https://github.com/zhiheng-zhang-Mera/DS-Hns"
    state: "EXISTING_INDEPENDENT_REPOSITORY"
    role: "engineering construction orchestrator and execution system"
  existing_services:
    - repository: "https://github.com/zhiheng-zhang-Mera/dsh-health-scheduler"
      state: "EXISTING_INDEPENDENT_REPOSITORY"
      role: "host/runtime health observation and maintenance/restart recommendation"
    - repository: "https://github.com/zhiheng-zhang-Mera/dsh-restart"
      state: "EXISTING_INDEPENDENT_REPOSITORY"
      role: "safe restart execution and external relaunch supervision"
  legacy_or_reference_assets:
    - repository: "https://github.com/zhiheng-zhang-Mera/Harness-Alien"
      role: "canonical historical host/shell baseline and adapter lineage"
    - repository: "https://github.com/zhiheng-zhang-Mera/Harness-Mega"
      role: "feature donor / legacy engineering asset; not a long-term top-level city building"
  planned_extractions_from_boss:
    - id: "engineering-execution-and-verification"
      current_implementation_source: "Codex-Boss"
      target_owner: "DS-Hns / Engineering domain"
      state: "PRESET"
      timing: "NOT_NOW"
      purpose: "Move ordinary engineering completion, verification, recovery and construction-session responsibilities out of City Core."
      include:
        - "engineering goal acceptance"
        - "engineering verification-policy and targeted-test selection"
        - "ordinary construction/acceptance session bookkeeping"
        - "construction-result verification"
        - "engineering recovery and retry-loop semantics"
        - "CI repair-loop mechanics where they are engineering execution rather than city trust"
        - "engineering evidence production required to prove a task was completed"
      exclude:
        - "Owner/Root Trust and constitutional authority"
        - "city-wide protected-surface definitions"
        - "generic durable core state/event primitives"
        - "production qualification / trusted-runner attestation owned by Boss-Qualification-Control"
        - "city-wide audit/provenance primitives"
        - "domain-specific business acceptance outside Engineering"
      candidate_boss_surfaces:
        - "electron/engineering/goal-acceptance.ts"
        - "electron/engineering/verification-policy.ts"
        - "ordinary engineering portions of electron/engineering/acceptance-session.ts"
        - "ordinary engineering portions of electron/engineering/final-acceptance-gate.ts"
        - "engineering/CI repair and recovery loops that do not define constitutional trust"
      target_hns_surfaces:
        - "app/engineering/verifier.cjs"
        - "app/engineering/checkpoint.cjs"
        - "app/engineering/supervisor.cjs"
        - "app/engineering/scheduler.cjs"
        - "app/engineering/failure.cjs"
      extraction_gate:
        - "one canonical engineering acceptance model"
        - "no duplicated Boss/Hns engineering verdict logic"
        - "Hns can verify an engineering task through stable Core contracts"
        - "production qualification remains separately attestable by Boss-Qualification-Control"

project_placement_overrides:
  - repository: "https://github.com/zhiheng-zhang-Mera/Codex-Boss"
    placement: "00/01 City Core"
    rule: "Not a Government-Safety building; government services consume Core authority/runtime facts."
  - repository: "https://github.com/zhiheng-zhang-Mera/General-Logic-Engine"
    placement: "00/05 Control Centre"
    role: "logic/rule/state-propagation/explanation backend component"
    rule: "Not a Government-Safety building; not the whole Control Centre UI."

project_registry:
  state: "PENDING_REVIEW"
  rule: "Directory naming does not imply final project ownership."
